name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # bindgen (used by rusty_link) needs libclang from the preinstalled LLVM
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check toolchain
        shell: pwsh
        run: |
          Write-Host "LIBCLANG_PATH=$env:LIBCLANG_PATH"
          Get-ChildItem "$env:LIBCLANG_PATH" -Filter "libclang*"
          where.exe clang
          cmake --version

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: takt-windows-x86_64
          path: target/release/takt.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: takt-windows-x86_64

      - name: Zip
        run: zip takt-windows-x86_64.zip takt.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: takt-windows-x86_64.zip
